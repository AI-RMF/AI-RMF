<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style><title>AIRMAC v1.1.0</title>

<style>
/* Layout: assessor's workbench — a fixed step rail on the left, one working surface on the right; stacks to a scrolling step strip on phones. */
:root{
 --bg:#F3F5F8;--surface:#FFFFFF;--sunk:#EAEEF3;--ink:#14213A;--ink2:#3A4760;--muted:#566178;--line:#D6DCE5;
 --accent:#1F3A5F;--accent-ink:#FFFFFF;--accent-soft:#E3EAF4;--gold:#9A6F0B;--gold-soft:#F4E9C8;--focus:#2F6FD6;
 --good:#23704A;--good-bg:#E2F2E8;--warn:#9A4A06;--warn-bg:#FDF0DC;--crit:#B42318;--crit-bg:#FCE8E6;
 --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--f-body:'IBM Plex Sans',-apple-system,'Segoe UI',Arial,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
 --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0D131E;--surface:#141C2A;--sunk:#1A2435;--ink:#E5EAF2;--ink2:#C3CCDA;--muted:#9BA6BA;--line:#2A3549;
 --accent:#9DBBE6;--accent-ink:#0D131E;--accent-soft:#1E2D45;--gold:#E3B94B;--gold-soft:#3A3018;--focus:#7FA8F0;
 --good:#6FD39A;--good-bg:#16301F;--warn:#F6B66A;--warn-bg:#3A2A14;--crit:#FF8A80;--crit-bg:#3A1C1C;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0D131E;--surface:#141C2A;--sunk:#1A2435;--ink:#E5EAF2;--ink2:#C3CCDA;--muted:#9BA6BA;--line:#2A3549;
 --accent:#9DBBE6;--accent-ink:#0D131E;--accent-soft:#1E2D45;--gold:#E3B94B;--gold-soft:#3A3018;--focus:#7FA8F0;
 --good:#6FD39A;--good-bg:#16301F;--warn:#F6B66A;--warn-bg:#3A2A14;--crit:#FF8A80;--crit-bg:#3A1C1C;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{color:var(--accent)}
h2{font-size:1.9rem;font-weight:700}h3{font-size:1.25rem;font-weight:600}h4{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:.85em}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 22px max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand .mark{font:600 .75rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.brand b{font-family:var(--f-display);font-size:2rem;font-weight:700;letter-spacing:.04em;color:var(--accent);line-height:1}
.brand span{font-size:.78rem;color:var(--muted);line-height:1.35}
.brand small{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;text-align:left;border:0;border-left:3px solid transparent;background:none;color:var(--muted);font:600 .95rem var(--f-display);letter-spacing:.04em;text-transform:uppercase;padding:7px 8px;border-radius:0 6px 6px 0;cursor:pointer}

.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.head .sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.lede{color:var(--ink2);max-width:72ch}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label,.eyebrow{font:600 .7rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--ink2);min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:.78rem}
input,select,textarea{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;min-width:0}

input[type=checkbox]{width:auto;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
button.b{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:5px;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--accent)}
button.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.b.danger{color:var(--crit)}
button.b.sm{padding:4px 9px;font-size:.78rem}

.chip{display:inline-flex;align-items:center;gap:5px;font:600 .72rem var(--f-body);padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.crit{background:var(--crit-bg);color:var(--crit)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.plain::before{display:none}
.tag{font:500 .72rem var(--f-mono);padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--ink2);white-space:nowrap}
.tag.fed{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.banner{border:1px solid var(--line);background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.notice{border-left:3px solid var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;color:var(--ink)}
.issues{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.issues li::marker{color:var(--warn)}
.ok-line{color:var(--good);font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:3.8rem;line-height:1;color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font:700 1.9rem var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink2)}
.steps li::before{content:counter(s);font:700 1.1rem var(--f-display);color:var(--gold)}
.steps b{color:var(--ink);font-size:.92rem}
/* practices */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 160px);overflow:auto;position:sticky;top:16px}
.plist h4{font:600 .82rem var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:10px 6px 4px}
.plist button{display:grid;grid-template-columns:52px 1fr auto;gap:6px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);font:400 .84rem var(--f-body);padding:6px;border-radius:5px;cursor:pointer}
.plist button:hover{background:var(--sunk)}
.plist button{border-left:3px solid transparent}
.plist button.on{background:var(--sunk);border-left-color:var(--gold)}
.plist .pid{font:500 .72rem var(--f-mono);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}.dot.na{background:transparent;border:1.5px solid var(--muted)}
.criteria{font-size:1rem;color:var(--ink);border-left:3px solid var(--gold);background:var(--gold-soft);padding:8px 12px;border-radius:0 6px 6px 0}
.qs{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;color:var(--ink2);font-size:.9rem}
details.links{border:1px solid var(--line);border-radius:5px;padding:8px 10px}
details.links summary{cursor:pointer;font-weight:600;font-size:.85rem}
details.links .opts{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-height:260px;overflow:auto}
details.links label{display:flex;gap:8px;align-items:flex-start;font-size:.84rem}
.derived{background:var(--sunk);border-radius:5px;padding:8px 10px;font-size:.85rem;display:flex;flex-direction:column;gap:2px}
/* tables */
.tw{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 .8rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.matrix select{min-width:84px;padding:4px 6px;font-size:.82rem}
.matrix td.pass select{border-color:var(--good)}.matrix td.fail select{border-color:var(--crit);color:var(--crit)}
/* profile chart */
.profile{display:flex;flex-direction:column;gap:2px}
.prow{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 92px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .nm{font-size:.86rem;font-weight:500}
.track{position:relative;height:26px}
.track .axis{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.track .tick{position:absolute;top:8px;width:1px;height:10px;background:var(--line)}
.track .gap{position:absolute;top:11px;height:4px;background:var(--accent);opacity:.35;border-radius:2px}
.track .cur,.track .tgt{position:absolute;top:5px;width:16px;height:16px;margin-left:-8px;border-radius:50%}
.track .cur{background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.track .tgt{background:var(--surface);border:2.5px solid var(--ink2)}
.track .ceil{position:absolute;top:0;width:3px;height:26px;margin-left:-1.5px;background:var(--gold);border-radius:2px}
.prow .vals{font:500 .78rem var(--f-mono);color:var(--ink2);text-align:right;white-space:nowrap}
.scale{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 92px;gap:12px}
.scale .lbls{position:relative;height:16px;font:500 .68rem var(--f-mono);color:var(--muted)}
.scale .lbls span{position:absolute;transform:translateX(-50%);white-space:nowrap}.scale .lbls span:first-child{transform:none}.scale .lbls span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.8rem;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.c{background:var(--accent)}.legend i.t{border:2.5px solid var(--ink2)}.legend i.k{width:3px;height:14px;border-radius:2px;background:var(--gold)}
.lvls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lvls li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:.84rem;padding:5px 8px;border-radius:5px;color:var(--ink2)}
.lvls li b{font-weight:600;color:var(--ink)}
.lvls li.cur{background:var(--accent-soft)}
.lvls li.above{opacity:.55}
.roadmap{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.roadmap .col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.roadmap .item{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:8px;font-size:.82rem;display:flex;flex-direction:column;gap:4px}
.sev-Critical{border-left:3px solid var(--crit)}.sev-High{border-left:3px solid var(--crit)}.sev-Medium{border-left:3px solid var(--warn)}.sev-Low{border-left:3px solid var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:.88rem;max-width:min(560px,calc(100% - 32px));z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:860px){
 .brand .mark{display:none}
 nav button{border-left:0;border-bottom:3px solid transparent;border-radius:0}
 nav button.on{border-bottom-color:var(--gold)}
 .app{grid-template-columns:minmax(0,1fr)}
 .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;align-items:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:12px}
 body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
 .brand span,.brand small,.rail-foot{display:none}
 .brand b{font-size:1.4rem}
 nav{flex-direction:row;gap:2px}
 nav button{grid-template-columns:auto;padding:6px 10px;white-space:nowrap}
 nav button .n,nav button .st{display:none}
 .split{grid-template-columns:minmax(0,1fr)}
 .plist{position:static;max-height:280px}
 .prow,.scale{grid-template-columns:96px minmax(0,1fr) 64px;gap:8px}
 .big{font-size:2.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div class="app">
 <aside class="rail">
  <div class="brand"><span class="mark">Security of AI™</span><b>AIRMAC</b><span>AI Risk Management Capability Assessment</span><small>Organizational · NIST AI RMF 1.0</small></div>
  <nav id="nav" aria-label="Assessment steps"></nav>
  <div class="rail-foot"><span id="save-status">Changes are saved in this browser.</span><span id="ver"></span><span>AI-RMF® · Security of AI™</span></div>
 </aside>
 <main><div class="wrap" id="main"></div></main>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
const VERSION='1.1.0';
const METHOD_VERSION='0.1';
const KEY='airmac-v1.1';

/* ---------- Maturity scale (AIRMAC scale; NIST AI RMF does not prescribe maturity levels) ---------- */
const LEVELS=[
 {n:1,name:'Initial',d:'Ad hoc or missing. No formal process.'},
 {n:2,name:'Developing',d:'Some processes exist but are incomplete or inconsistently applied.'},
 {n:3,name:'Defined',d:'Documented processes exist and sampled systems show they are followed.'},
 {n:4,name:'Managed',d:'Processes are measured, monitored and consistently applied.'},
 {n:5,name:'Optimizing',d:'Continuous improvement driven by measurement; integrated into strategy.'}
];

/* ---------- Domains with anchored level descriptors ---------- */
const DOMAINS=[
 {id:'GOV',name:'Governance & Accountability',short:'Governance',focus:'Policy, legal requirements, roles, executive accountability, and integration with enterprise risk management.',
  levels:['No AI risk policy or named accountability; decisions are ad hoc.','Draft or partial policy; roles exist informally; leadership involvement is occasional.','Approved lifecycle policy, documented roles and decision authorities, and evidence they are followed.','Leadership reviews AI risk metrics on a set cadence; policy compliance is measured; AI risk is part of ERM reporting.','Governance adapts from metrics and lessons learned; AI risk informs strategy and investment decisions.']},
 {id:'RSK',name:'Risk Appetite & Decision Criteria',short:'Risk criteria',focus:'Risk tolerance, risk tiering, the deployment decision gate, and residual-risk acceptance.',
  levels:['No defined risk tolerance; acceptance of risk is implicit.','Tolerance or tiering exists in draft or for some systems; gate and acceptance steps are inconsistent.','Approved tolerance and tiering criteria; a deployment gate and residual-risk acceptance at set authority are applied to sampled systems.','Gate outcomes, acceptances and expiries are tracked and reported; criteria are calibrated against outcomes.','Tolerance and criteria are revisited from portfolio trends and incidents; every decision is traceable.']},
 {id:'INV',name:'AI Inventory & Lifecycle',short:'Inventory & lifecycle',focus:'Inventory completeness, intake, change-driven reassessment, and decommissioning.',
  levels:['No inventory, or a list nobody owns.','Inventory exists but misses third-party or embedded AI; intake can be bypassed.','Complete inventory with owner and tier; intake, change and retirement steps are followed in sampled systems.','Completeness is measured and reconciled against procurement and IT asset records on a schedule.','New AI is detected automatically (procurement, code, cloud), and the inventory drives the assessment plan.']},
 {id:'PPL',name:'People, Culture & Human Oversight',short:'People & oversight',focus:'Role-based training, multidisciplinary decisions, human oversight roles, risk culture, and impact documentation.',
  levels:['No AI risk training; oversight roles undefined; concerns have no channel.','Some training and oversight roles exist, unevenly applied.','Role-based training, defined oversight roles, multidisciplinary reviews and a concern channel operate for sampled systems.','Training completion, oversight effectiveness and concern handling are measured and acted on.','Culture data and lessons learned continually reshape training, team composition and oversight design.']},
 {id:'TPR',name:'Third-Party & Supply Chain',short:'Third-party',focus:'Policy, due diligence, monitoring, and contingency for third-party models, data, software and services.',
  levels:['Third-party AI is acquired with no AI-specific review.','Some due diligence occurs, but criteria and contract terms vary.','Policy-based due diligence, contract terms, monitoring and contingency plans are applied to sampled third-party systems.','Supplier AI risk is monitored with metrics; contract obligations are verified.','Supplier risk insight feeds acquisition strategy; contingencies are exercised.']},
 {id:'STK',name:'Stakeholder Engagement & Transparency',short:'Stakeholders',focus:'External feedback, feedback into design, user reporting channels, and disclosure of AI use.',
  levels:['No mechanism to hear from affected people.','Feedback is collected informally or for some systems.','Feedback, reporting and disclosure practices operate and feed design decisions in sampled systems.','Feedback volume, response times and resulting changes are measured.','Stakeholder input shapes priorities across the portfolio; transparency is proactive.']},
 {id:'MON',name:'Testing, Monitoring & Incident Response',short:'Monitoring & incidents',focus:'Independent evaluation, production monitoring, AI incident response, and emergent-risk tracking.',
  levels:['No defined testing, monitoring or AI incident process.','Testing and monitoring happen for some systems; incident handling is general-purpose only.','Tier-based testing, production monitoring plans and an AI incident process operate for sampled systems.','Monitoring results and incidents are trended; thresholds trigger defined actions.','Monitoring and incident insight drives proactive changes across systems.']},
 {id:'IMP',name:'Program Performance & Improvement',short:'Improvement',focus:'Program metrics, periodic program review, and lessons learned.',
  levels:['The program does not measure or review itself.','Occasional reviews; few or ad hoc metrics.','Scheduled program reviews with defined metrics; lessons are recorded.','Program metrics are tracked against targets and reported to leadership.','The program improves continually from metrics, benchmarks and lessons learned.']}
];

/* ---------- Practices: the assessable units ---------- */
const PRACTICES=[
 {id:'GOV-1',d:'GOV',t:'AI risk management policy',s:'A documented, approved AI risk management policy covers the full AI lifecycle and incorporates the characteristics of trustworthy AI.',nist:['GOVERN 1.2','GOVERN 1.4'],
  q:['Is there an approved AI risk management policy, and who approved it?','Does it cover design, development, deployment, operation and retirement?','Does it address the trustworthy characteristics: valid and reliable; safe; secure and resilient; accountable and transparent; explainable and interpretable; privacy-enhanced; fair with harmful bias managed?'],ev:'Approved policy, policy review record, distribution or attestation records.'},
 {id:'GOV-2',d:'GOV',t:'Legal and regulatory requirements',s:'Legal, regulatory and contractual requirements that apply to AI are identified, documented, kept current and assigned to owners.',nist:['GOVERN 1.1'],
  q:['Is there a register of AI-relevant legal and regulatory requirements?','Who monitors changes, and how often?','How are requirements traced to controls or system obligations?'],ev:'Requirements register, legal review memos, change log.'},
 {id:'GOV-3',d:'GOV',t:'Roles and decision authority',s:'Roles, responsibilities and decision authorities for AI risk are documented, assigned to named people and communicated.',nist:['GOVERN 2.1'],

/* Merge stored data onto defaults so older files never fail on a missing field. */
function normalize(o){
 if(!o||typeof o!=='object'||o.schema!=='airmac'||![1,2].includes(o.version))throw Error('Unsupported AIRMAC assessment file.');
 const legacy=o.version===1,b=blank();
 const merge=(def,raw,label)=>{const out={};raw=raw&&typeof raw==='object'?raw:{};for(const [k,d] of Object.entries(def)){const v=raw[k];if(v===undefined){out[k]=structuredClone(d);continue}if(Array.isArray(d)){if(!Array.isArray(v)||v.some(x=>typeof x!=='string'))throw Error(label+'.'+k+' must be an array of IDs.');out[k]=v.slice()}else if(typeof d==='boolean'){if(typeof v!=='boolean')throw Error(label+'.'+k+' must be true or false.');out[k]=v}else if(d&&typeof d==='object'){out[k]=v&&typeof v==='object'&&!Array.isArray(v)?v:{}}else{if(typeof v!=='string')throw Error(label+'.'+k+' must be text.');out[k]=v}}return out};
 const arr=(v,label)=>{if(v===undefined)return [];if(!Array.isArray(v)||v.some(x=>!x||typeof x!=='object'||Array.isArray(x)))throw Error(label+' must be a list of records.');return v};
 const choice=(v,opts,label)=>{if(!opts.includes(v))throw Error('Invalid '+label+': '+String(v).slice(0,60))};
 const date=(v,label)=>{if(v&&!validDate(v))throw Error('Invalid date for '+label)};
 const n=b;n.example=!!o.example;n.meta=merge(b.meta,o.meta,'scope');n.signoff=merge(b.signoff,o.signoff,'signoff');n.summary=typeof o.summary==='string'?o.summary:'';
 if(!legacy){if(typeof o.assessmentId!=='string'||!/^AIRMAC-[A-Za-z0-9-]+$/.test(o.assessmentId))throw Error('Invalid assessment ID.');n.assessmentId=o.assessmentId;if(!Number.isInteger(o.revision)||o.revision<1)throw Error('Invalid revision.');n.revision=o.revision;if(o.methodVersion!==METHOD_VERSION)throw Error('Unsupported method version.');}
 for(const p of PRACTICES){const x=merge(blankPractice(),o.practices?.[p.id],p.id);choice(x.design,DESIGN,p.id+' design');choice(x.operating,OPERATING,p.id+' operation');choice(x.designConfidence,CONFS,p.id+' design confidence');choice(x.opConfidence,CONFS,p.id+' operation confidence');date(x.followupDate,p.id+' follow-up');n.practices[p.id]=x}
 for(const d of DOMAINS){const x=merge(blankDomain(),o.domains?.[d.id],d.id);choice(x.current,['','1','2','3','4','5'],d.id+' current');choice(x.target,['','1','2','3','4','5'],d.id+' target');n.domains[d.id]=x}
 n.evidence=arr(o.evidence,'evidence').map(x=>merge(blankEvidence(),x,'evidence'));
 n.systems=arr(o.systems,'systems').map(x=>{const y=merge(blankSystem(),x,'system');y.tests={};y.testDetails={};for(const t of TESTS){const r=x.tests?.[t.id]||'';choice(r,['','Pass','Fail','N/A'],t.id+' result');if(r)y.tests[t.id]=r;y.testDetails[t.id]=merge(blankTestDetail(),x.testDetails?.[t.id],t.id);choice(y.testDetails[t.id].eligibility,['Applicable','Not applicable'],t.id+' eligibility');date(y.testDetails[t.id].date,t.id);choice(y.testDetails[t.id].stopAssessment,['','Required stop or override unavailable','Other deficiency'],t.id+' stop impact')}return y});
 n.findings=arr(o.findings,'findings').map(x=>merge(blankFinding(),x,'finding'));
 n.history=arr(o.history,'history').map(x=>({date:String(x.date||''),event:String(x.event||''),actor:String(x.actor||''),path:String(x.path||''),before:String(x.before||''),after:String(x.after||'')}));
 n.testPlan=Object.fromEntries(TESTS.map(t=>[t.id,merge({criteria:'',applicability:''},o.testPlan?.[t.id],t.id+' plan')]));
 for(const e of n.evidence){choice(e.type,EV_TYPES,'evidence type');choice(e.confidence,CONFS,'evidence confidence');date(e.date,'evidence')}
 for(const x of n.systems){choice(x.source,SOURCES,'system source');choice(x.tier,TIERS,'risk tier');choice(x.stage,STAGES,'lifecycle stage');choice(x.result,RESULTS,'system result');choice(x.assessmentHistory,['Unknown','Reported never assessed','Previously assessed'],'assessment history');if(!/^\d+$/.test(x.openHigh)||!Number.isSafeInteger(+x.openHigh))throw Error('Residual risk counts must be nonnegative integers.');date(x.lastAssessed,'last assessment');if(legacy)x.assessmentHistory=x.lastAssessed?'Previously assessed':'Unknown'}
 for(const f of n.findings){choice(f.severity,SEVERITIES,'severity');choice(f.status,F_STATUS,'finding status');choice(f.horizon,HORIZONS,'horizon');for(const k of ['dueDate','verifiedDate','acceptExpiry','acceptReview'])date(f[k],k)}
 choice(n.meta.overlay,['None','Federal'],'overlay');choice(n.meta.scope,['Entire enterprise','Business unit or division','High-risk AI portfolio','Other'],'scope');choice(n.signoff.state,['Draft','Final'],'signoff');choice(n.signoff.sponsorStatus,['Pending','Accepted'],'sponsor acceptance');for(const k of ['date','nextReview','inventoryReconciled','planApprovedDate'])date(n.meta[k],k);for(const k of ['leadDate','sponsorDate','reviewDate'])date(n.signoff[k],k);
 for(const list of [n.evidence,n.systems,n.findings]){const seen=new Set();for(const x of list){if(typeof x.id!=='string'||!(/^[ESF]-\d+$/.test(x.id))||seen.has(x.id))throw Error('Missing, duplicate or invalid record ID.');seen.add(x.id)}}
 const eids=new Set(n.evidence.map(x=>x.id)),sids=new Set(n.systems.map(x=>x.id)),pids=new Set(PRACTICES.map(x=>x.id));
 const links=(ids,set,label)=>{if(ids.some(id=>!set.has(id)))throw Error('Broken '+label+' link.');};
 for(const p of Object.values(n.practices))for(const k of ['evidence','designEv','operatingEv'])links(p[k],eids,'evidence');
 for(const d of Object.values(n.domains))for(const k of ['metricsEv','improveEv'])links(d[k],eids,'domain evidence');
 for(const x of n.systems)for(const t of TESTS)links(x.testDetails[t.id].evidence,eids,'test evidence');
 for(const f of n.findings){if(f.practice&&!pids.has(f.practice))throw Error('Invalid finding practice.');links(f.practices,pids,'practice');links(f.systems,sids,'system');for(const k of ['evidence','closureEv'])links(f[k],eids,'finding evidence')}
 n.baselines=arr(o.baselines,'baselines').map(x=>{if(!Number.isInteger(x.revision)||typeof x.report!=='string'||!x.assessment||x.assessment.baselines?.length)throw Error('Invalid final baseline.');return {revision:x.revision,date:String(x.date||''),report:'',assessment:normalize({...x.assessment,baselines:[]})}});

 return n;
}

function operating(pid){
 const t=testFor(pid);if(!t)return {status:pr(pid).operating,derived:false};
 const st=testStats(t.id);let status;

const CONF={High:3,Moderate:2,Low:1};const CONF_NAME=['—','Low','Moderate','High'];
function practiceConf(pid){const ev=pr(pid).evidence.map(evBy).filter(Boolean);return ev.length?Math.max(...ev.map(e=>CONF[e.confidence]||0)):0}
function assessed(pid){const a=pr(pid);if(a.design==='Not rated'||!a.rationale.trim())return false;if((a.design==='Partial'||a.design==='Established')&&!a.evidence.length)return false;return true}
function isGap(pid){const a=pr(pid);if(a.design==='Not applicable'||a.design==='Not rated')return false;if(a.design!=='Established')return true;const o=operating(pid).status;return o==='Not operating'||o==='Inconsistent'}
function attested(d,k){return d[k]&&d[k+'Why'].trim()&&d[k+'Ev'].length>0}
function ceiling(did){
 const ps=PRACTICES.filter(p=>p.d===did&&pr(p.id).design!=='Not applicable');
 if(!ps.length)return {level:null,why:'Every practice is marked not applicable.'};
 const unrated=ps.filter(p=>!assessed(p.id));if(unrated.length)return {level:null,why:unrated.length+' practice'+(unrated.length>1?'s':'')+' still to rate.'};
 const des=ps.map(p=>pr(p.id).design);
 if(des.filter(d=>d!=='Not in place').length<ps.length/2)return {level:1,why:'Fewer than half of the practices are in place.'};
 if(des.some(d=>d!=='Established'))return {level:2,why:'Not every practice is established in design.'};
 const ops=ps.map(p=>operating(p.id).status);
 if(ops.includes('Not tested'))return {level:2,why:'Operation has not been tested for every practice.'};
 if(ops.includes('Not operating'))return {level:2,why:'At least one practice is not operating in practice.'};
 if(ps.some(p=>practiceConf(p.id)<2))return {level:2,why:'Level 3 needs Moderate or High confidence evidence for every practice.'};
 if(ops.some(o=>o!=='Effective'))return {level:3,why:'Some practices operate inconsistently.'};
 const d=dom(did);
 if(!attested(d,'metrics'))return {level:3,why:'Level 4 needs evidence that this domain\'s performance is measured.'};
 if(!attested(d,'improve'))return {level:4,why:'Level 5 needs evidence of a working improvement cycle.'};

function domainConf(did){const ps=PRACTICES.filter(p=>p.d===did&&['Partial','Established'].includes(pr(p.id).design));if(!ps.length)return 0;return Math.min(...ps.map(p=>practiceConf(p.id)))}
function overall(key){const lv=DOMAINS.map(d=>+dom(d.id)[key]).filter(Boolean);if(lv.length<DOMAINS.length)return null;const so=[...lv].sort((a,b)=>a-b);const med=so[Math.floor((so.length-1)/2)];return Math.min(med,so[0]+1)}
function recommendedSample(){const hi=s.systems.filter(x=>x.tier==='High-impact').length;const others=s.systems.length-hi;return {hi,others:Math.min(others,Math.max(2,Math.ceil(others*.1)))}}
function posture(){const sys=s.systems,hi=sys.filter(x=>x.tier==='High-impact');const yr=new Date();yr.setFullYear(yr.getFullYear()-1);const recent=x=>x.lastAssessed&&new Date(x.lastAssessed)>=yr;
 return {total:sys.length,hi:hi.length,mod:sys.filter(x=>x.tier==='Moderate').length,low:sys.filter(x=>x.tier==='Low').length,third:sys.filter(x=>x.source!=='Built in-house').length,
  hiRecent:hi.filter(recent).length,never:sys.filter(x=>x.result==='Not assessed').length,notAcc:sys.filter(x=>x.result==='Not acceptable').length,cond:sys.filter(x=>x.result==='Acceptable with conditions').length,

function readiness(){

 const miss=Object.entries(req).filter(([k])=>!String(m[k]).trim()).map(([,l])=>l);if(miss.length)I.push({t:1,m:'Scope is missing: '+miss.join(', ')+'.'});

 const open=sampled().reduce((n,x)=>n+TESTS.filter(T=>!x.tests[T.id]).length,0);if(open)I.push({t:3,m:open+' sample test result(s) are blank. Record Pass, Fail or N/A.'});
 const un=PRACTICES.filter(p=>!assessed(p.id));if(un.length)I.push({t:4,m:un.length+' practice(s) need a design rating, rationale and, where in place, linked evidence.'});
 for(const d of DOMAINS){const x=dom(d.id),c=ceiling(d.id);
  if(!x.current||!x.target||!x.rationale.trim())I.push({t:5,m:d.name+': record current level, target level and rationale.'});
  else{if(c.level!==null&&+x.current>c.level)I.push({t:5,m:d.name+': current level '+x.current+' is above what the evidence supports ('+c.level+').'});if(+x.target<+x.current)I.push({t:5,m:d.name+': target is below current level.'})}}
 const noF=gapPractices().filter(p=>!findingsFor(p.id).length);if(noF.length)I.push({t:7,m:noF.length+' gap(s) have no finding: '+noF.map(p=>p.id).join(', ')+'.'});

 <section class="card"><div class="row between"><span class="row"><span class="mono">${P.id}</span>${chip(stT,stC)}${P.nist.map(n=>`<span class="tag">${n}</span>`).join('')}${s.meta.overlay==='Federal'&&P.fed?`<span class="tag fed" title="${esc(P.fed)}">Federal</span>`:''}</span><span class="row">${btn('Previous','prev-p','sm',idx===0?'disabled':'')}${btn('Next','next-p','sm',idx===PRACTICES.length-1?'disabled':'')}</span></div>
  <div><p class="eyebrow">${esc(D.name)}</p><h3>${esc(P.t)}</h3></div>
  <p class="criteria">${esc(P.s)}</p>
  ${s.meta.overlay==='Federal'&&P.fed?`<p class="small"><span class="tag fed">Federal</span> ${esc(P.fed)}</p>`:''}
  <details><summary class="small" style="cursor:pointer;font-weight:600">Guiding questions and evidence to look for</summary><ul class="qs" style="margin-top:8px">${P.q.map(q=>`<li>${esc(q)}</li>`).join('')}</ul><p class="small muted" style="margin-top:6px"><b>Evidence:</b> ${esc(P.ev)}</p></details>
  <div class="g2">${field('Design status','practices.'+P.id+'.design','select',DESIGN,'Is the practice documented and established?')}<div class="f" style="display:flex;flex-direction:column;gap:4px"><span class="label">Evidence confidence</span><span>${chip(CONF_NAME[practiceConf(P.id)],practiceConf(P.id)>=2?'good':practiceConf(P.id)?'warn':'')}</span><span class="small muted">Assessed sufficiency for design and operation, supported by valid evidence.</span></div></div>
  ${opBlock}
  ${field('Rationale','practices.'+P.id+'.rationale','textarea',[],'What you found and why it supports the rating.')}
  ${a.design==='Not applicable'?'':evLinks('practices.'+P.id+'.evidence',a.evidence)}
  ${isGap(P.id)?`<div class="notice small">This practice is a gap. ${findingsFor(P.id).length?findingsFor(P.id).length+' finding(s) linked.':'It needs a finding.'} ${btn(findingsFor(P.id).length?'Open findings':'Draft a finding','draft-one','sm',`data-p="${P.id}"`)}</div>`:''}
 </section></div>`}

/* ---------- 06 Maturity ---------- */
function profileChart(){
 const pos=n=>((n-1)/4*100)+'%';
 return `<div class="legend"><span><i class="c"></i>Current</span><span><i class="t"></i>Target</span><span><i class="k"></i>Evidence ceiling (highest supported level)</span></div>
 <div class="profile" role="img" aria-label="Maturity profile: current and target level by domain">${DOMAINS.map(d=>{const x=dom(d.id),c=ceiling(d.id).level,cu=+x.current,tg=+x.target;
  return `<div class="prow"><span class="nm">${esc(d.short)}</span><div class="track" title="${esc(d.name)}: current ${cu||'—'}, target ${tg||'—'}, ceiling ${c||'—'}"><span class="axis"></span>${[1,2,3,4,5].map(n=>`<span class="tick" style="left:${pos(n)}"></span>`).join('')}${cu&&tg&&tg>cu?`<span class="gap" style="left:${pos(cu)};width:calc(${pos(tg)} - ${pos(cu)})"></span>`:''}${c?`<span class="ceil" style="left:${pos(c)}"></span>`:''}${tg?`<span class="tgt" style="left:${pos(tg)}"></span>`:''}${cu?`<span class="cur" style="left:${pos(cu)}"></span>`:''}</div><span class="vals">${cu||'—'} → ${tg||'—'}</span></div>`}).join('')}
 <div class="scale"><span></span><div class="lbls">${LEVELS.map(l=>`<span style="left:${pos(l.n)}">${l.n} ${l.name}</span>`).join('')}</div><span></span></div></div>`}
function maturity(){const cur=overall('current'),tgt=overall('target');
 return `<section class="card"><div class="row between"><h3>Maturity profile</h3><span class="small muted">Overall: <b>${lvlName(cur)}</b> · Target: <b>${lvlName(tgt)}</b></span></div>${profileChart()}<p class="small muted">Levels: ${LEVELS.map(l=>`<b>${l.n} ${l.name}</b> ${esc(l.d)}`).join(' ')} This 1–5 scale is the AIRMAC scale. NIST AI RMF does not define maturity levels.</p></section>
 ${DOMAINS.map(d=>{const x=dom(d.id),c=ceiling(d.id),p='domains.'+d.id+'.',ps=PRACTICES.filter(q=>q.d===d.id);const over=c.level!==null&&x.current&&+x.current>c.level;
  const cnt=k=>ps.filter(q=>pr(q.id).design===k).length;
  return `<section class="card"><div class="row between"><div><p class="eyebrow">${d.id}</p><h3>${esc(d.name)}</h3><p class="small muted">${esc(d.focus)}</p></div><div class="row">${chip('Ceiling '+(c.level??'—'),c.level>=3?'good':c.level?'warn':'')}${chip('Confidence '+CONF_NAME[domainConf(d.id)],domainConf(d.id)>=2?'good':domainConf(d.id)?'warn':'')}</div></div>
  <p class="small"><b>Ceiling:</b> ${esc(c.why)} · <b>Practices:</b> ${cnt('Established')} established, ${cnt('Partial')} partial, ${cnt('Not in place')} not in place${cnt('Not applicable')?', '+cnt('Not applicable')+' N/A':''}${cnt('Not rated')?', '+cnt('Not rated')+' to rate':''}. ${btn('Review practices','filter-p','sm',`data-d="${d.id}"`)}</p>
  <ul class="lvls">${d.levels.map((t,i)=>`<li class="${+x.current===i+1?'cur':''} ${c.level&&i+1>c.level?'above':''}"><b>${i+1} ${LEVELS[i].name}</b><span>${esc(t)}</span></li>`).join('')}</ul>
  <div class="g2">${field('Current level',p+'current','select',[['','Select…'],...LEVELS.map(l=>[String(l.n),l.n+' · '+l.name+(c.level&&l.n>c.level?' (above ceiling)':'')])])}${field('Target level',p+'target','select',[['','Select…'],...LEVELS.map(l=>[String(l.n),l.n+' · '+l.name])],'Set with the sponsor. Not every organization needs level 5.')}</div>
  ${over?`<div class="banner small"><span>Current level ${x.current} is above the evidence ceiling of ${c.level}. Lower it, or add the evidence that supports it.</span></div>`:''}
  ${field('Rationale',p+'rationale','textarea',[],'Why this level, citing practices and evidence.')}
  <details ${x.metrics||x.improve?'open':''}><summary class="small" style="cursor:pointer;font-weight:600">Evidence for levels 4 and 5</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
   ${field('Domain performance is measured and reviewed (needed for level 4)',p+'metrics','check')}${x.metrics?field('What is measured, by whom, how often',p+'metricsWhy','textarea')+evLinks(p+'metricsEv',x.metricsEv,'Measurement evidence'):''}
   ${field('An improvement cycle is working (needed for level 5)',p+'improve','check')}${x.improve?field('Improvements made from measurement',p+'improveWhy','textarea')+evLinks(p+'improveEv',x.improveEv,'Improvement evidence'):''}
  </div></details></section>`}).join('')}`}

/* ---------- 07 Evidence ---------- */
function usedBy(eid){const u=[];for(const p of PRACTICES)if(pr(p.id).evidence.includes(eid))u.push(p.id);for(const d of DOMAINS){const x=dom(d.id);if(x.metricsEv.includes(eid)||x.improveEv.includes(eid))u.push(d.id+' level evidence')}return u}
function evidence(){return `<p class="lede">Record what you examined: documents, records, interviews and observations. Confidence describes how strongly the record supports a conclusion. <b>High</b>: authoritative, current record of the practice operating. <b>Moderate</b>: a sound record with limits (partial coverage, older date). <b>Low</b>: testimony or indirect evidence only. Level 3 and above need Moderate or High evidence for every practice.</p>
 <div class="row">${btn('Add evidence record','add-ev','pri')}</div>
 <div class="grid">${s.evidence.map((e,i)=>{const p='evidence.'+i+'.',u=usedBy(e.id);return `<section class="card"><div class="row between"><span class="row"><span class="mono">${esc(e.id)}</span>${chip(e.confidence,e.confidence==='High'?'good':e.confidence==='Moderate'?'acc':'warn')}</span>${btn('Delete','del-ev','sm danger',`data-i="${i}"`)}</div>
  ${field('Title',p+'title')}<div class="g2">${field('Type',p+'type','select',EV_TYPES)}${field('Confidence',p+'confidence','select',CONFS)}${field('Date of record',p+'date','date')}${field('Source or owner',p+'source')}</div>${field('Reference or location',p+'ref','text',[],'Document number, repository path, interview log ID.')}${field('Notes',p+'notes','textarea')}
  <p class="small muted">${u.length?'Used by: '+u.map(esc).join(', '):'Not linked to any practice yet.'}</p></section>`}).join('')||'<section class="card flat"><p class="muted">No evidence yet.</p></section>'}</div>`}

/* ---------- 08 Findings & roadmap ---------- */
function findings(){
 const pending=gapPractices().filter(p=>!findingsFor(p.id).length);
 const shown=s.findings.map((f,i)=>({f,i})).filter(({f})=>fFilter==='All'||f.status===fFilter);
 const open=s.findings.filter(f=>f.status==='Open'||f.status==='In progress');
 const rank=f=>SEVERITIES.indexOf(f.severity);
 return `<p class="lede">Every gap needs a finding written in audit form. <b>Condition</b>: what you found. <b>Criteria</b>: what is expected (the practice statement). <b>Cause</b>: why the gap exists. <b>Effect</b>: the risk it creates. <b>Recommendation</b>: what to do. Assign an owner and a horizon so findings form the roadmap.</p>
 <div class="row">${btn('Draft findings for '+pending.length+' gap(s) without one','draft-all','pri',pending.length?'':'disabled')}${btn('Add a blank finding','add-f')}<label class="f" for="ff" style="margin-left:auto;min-width:180px">Show<select id="ff">${['All',...F_STATUS].map(x=>`<option ${fFilter===x?'selected':''}>${x}</option>`).join('')}</select></label></div>
 <section class="card"><h3>Roadmap</h3><div class="roadmap">${HORIZONS.map(h=>{const items=open.filter(f=>f.horizon===h).sort((a,b)=>rank(a)-rank(b));return `<div class="col"><p class="label">${h}</p>${items.map(f=>`<div class="item sev-${esc(f.severity)}"><span class="row"><span class="mono">${esc(f.id)}</span>${chip(f.severity,f.severity==='Critical'||f.severity==='High'?'crit':f.severity==='Medium'?'warn':'')}</span><span>${esc(f.title||'(untitled)')}</span><span class="small muted">${esc(f.owner||'No owner')}</span></div>`).join('')||'<span class="small muted">Nothing scheduled.</span>'}</div>`}).join('')}</div></section>
 ${shown.map(({f,i})=>{const p='findings.'+i+'.';return `<section class="card sev-${esc(f.severity)}"><div class="row between"><span class="row"><span class="mono">${esc(f.id)}</span>${chip(f.status,f.status==='Closed'?'good':f.status==='Risk accepted'?'':'acc')}${f.practice?`<span class="tag">${esc(f.practice)}</span>`:''}</span>${btn('Delete','del-f','sm danger',`data-i="${i}"`)}</div>
  <div class="g2">${field('Title',p+'title')}${field('Practice',p+'practice','select',[['','None'],...PRACTICES.map(x=>[x.id,x.id+' · '+x.t])])}</div>
  <div class="g2">${field('Condition (what was found)',p+'condition','textarea')}${field('Criteria (what is expected)',p+'criteria','textarea')}${field('Cause',p+'cause','textarea')}${field('Effect (risk created)',p+'effect','textarea')}</div>
  ${field('Recommendation',p+'recommendation','textarea')}
  <div class="g2">${field('Severity',p+'severity','select',SEVERITIES)}${field('Owner',p+'owner')}${field('Horizon',p+'horizon','select',HORIZONS)}${field('Status',p+'status','select',F_STATUS)}</div></section>`}).join('')||'<section class="card flat"><p class="muted">No findings to show.</p></section>'}`}

/* ---------- 09 Report & sign-off ---------- */
function report(){const I=readiness(),P=posture(),so='signoff.';
 return `<section class="card"><h3>Scorecard</h3><div class="row" style="gap:24px;align-items:flex-end"><div><p class="label">Overall</p><span class="big">${overall('current')||'—'}</span></div><div><p class="h3" style="font:700 1.1rem var(--f-display)">${overall('current')?LEVELS[overall('current')-1].name:'Not yet rated'}</p><p class="small muted">Target ${lvlName(overall('target'))}</p></div></div>${profileChart()}</section>
 <section class="card"><h3>Portfolio risk posture</h3><p class="small muted">Reported alongside maturity and never folded into it. A mature program can carry accepted residual risk, and an immature one can look low-risk because it has not found its risks yet.</p>
 <div class="kpis"><div class="kpi"><b>${P.total}</b><span>AI systems</span></div><div class="kpi"><b>${P.hi}</b><span>High-impact</span></div><div class="kpi"><b>${P.hiRecent}/${P.hi}</b><span>High-impact assessed in last 12 months</span></div><div class="kpi"><b>${P.never}</b><span>Reported never assessed</span></div><div class="kpi"><b>${P.cond}</b><span>Operating with conditions</span></div><div class="kpi"><b>${P.notAcc}</b><span>Not acceptable</span></div><div class="kpi"><b>${P.openHigh}</b><span>Open high/critical residual risks</span></div></div></section>
 <section class="card"><h3>Executive summary</h3>${field('Summary for leadership','summary','textarea',[],'Two or three paragraphs: overall level, the few gaps that matter most, and the decisions needed from leadership.')}
 <div class="derived"><span class="label">Facts to draw on</span><span>${esc(autoFacts())}</span></div></section>
 <section class="card"><h3>Readiness</h3>${I.length?`<ul class="issues">${I.map(x=>`<li>${esc(x.m)} <button type="button" class="b sm" data-action="go" data-to="${x.t}">Go</button></li>`).join('')}</ul>`:'<p class="ok-line">Every requirement is met.</p>'}</section>
 <section class="card"><h3>Sign-off</h3><div class="g2">${field('Lead assessor',so+'lead')}${field('Date',so+'leadDate','date')}${field('Sponsor acceptance',so+'sponsor',undefined,[],'Optional: the sponsor who received the report.')}${field('Date',so+'sponsorDate','date')}</div>${field('Sponsor comments',so+'sponsorNote','textarea')}
  <div class="row">${s.signoff.state==='Final'?chip('Final','good')+'<span class="small muted">Any change returns the assessment to Draft.</span>':btn('Mark as final','finalize','pri',I.length?'disabled title="Resolve readiness items first"':'')}</div></section>
 <section class="card"><h3>Deliverables</h3><p class="small muted">The report is a self-contained HTML file. Open it in any browser and print or save it as PDF.</p><div class="row">${btn('Download full report (.html)','dl-report','pri')}${btn('Findings (.csv)','dl-findings')}${btn('Inventory (.csv)','dl-inventory')}${btn('Assessment data (.json)','export')}${window.claude?'':btn('Print this page','print')}</div></section>`}
function autoFacts(){const P=posture(),c=overall('current'),t=overall('target');const weak=DOMAINS.filter(d=>dom(d.id).current).sort((a,b)=>+dom(a.id).current-+dom(b.id).current).slice(0,2);
 const hi=s.findings.filter(f=>(f.severity==='High'||f.severity==='Critical')&&f.status!=='Closed').length;
 return `Overall level ${c?c+' ('+LEVELS[c-1].name+')':'not yet rated'}${t?', target '+t:''}. Weakest domains: ${weak.map(d=>d.short+' ('+dom(d.id).current+')').join(', ')||'not rated'}. ${gapPractices().length} of ${PRACTICES.length} practices are gaps; ${hi} high or critical findings are open. Inventory: ${P.total} systems, ${P.hi} high-impact, ${P.never} never assessed, ${P.openHigh} open high/critical residual risks.`}

/* ---------- 10 Method & files ---------- */
function method(){const cov=GOVERN_SUBS.map(g=>[g,PRACTICES.filter(p=>p.nist.includes(g)).map(p=>p.id)]);const other=[...new Set(PRACTICES.flatMap(p=>p.nist).filter(n=>!n.startsWith('GOVERN')))].sort();
 return `<div class="grid"><section class="card"><h3>Scoring rules</h3><ol class="qs">
  <li>Each practice gets a <b>design status</b> and, when in place, an <b>operating status</b>. Practices with a sample test take operation from the test results. Organization-wide practices take it from direct evidence.</li>
  <li>The <b>evidence ceiling</b> for a domain is the highest level its practices support: below half in place → 1; anything not fully established, untested, not operating, or resting only on Low-confidence evidence → 2; all established and operating → 3; all Effective plus measurement evidence → 4; plus a working improvement cycle → 5.</li>
  <li>The assessor sets <b>current</b> and <b>target</b> levels using the anchored descriptions. Current may be at or below the ceiling, never above it.</li>
  <li><b>Overall</b> = the median domain level, capped at one level above the weakest domain. A missing capability cannot be averaged away.</li>
  <li><b>Portfolio risk posture</b> is reported separately and never scored.</li>
  <li>The assessment can be marked <b>Final</b> only when every readiness item is met. Any later change returns it to Draft and is logged.</li>
 </ol><p class="small muted">The AI RMF is voluntary. AIRMAC reports alignment with it and progress toward the organization's own target profile (NIST AI RMF Section 6), not compliance.</p></section>
 <section class="card"><h3>Files</h3><p class="small muted">Work is saved in this browser only. Export JSON to keep a copy, move to another device, or share with the assessment team.</p><div class="row">${btn('Export JSON','export','pri')}<label class="b" for="import-file" style="cursor:pointer">Import JSON<input type="file" id="import-file" accept=".json,application/json" class="sr"></label></div><div class="row">${btn('Start a new assessment','new')}${btn('Load built-in Harborview example','load-example')}</div>
 ${recoveryKeys().length?`<h4>Recovery copies</h4><p class="small muted">Saved data that could not be loaded was kept here.</p><div class="row">${recoveryKeys().map(k=>btn('Download recovery from '+new Date(+k.split('-').pop()).toLocaleString(),'dl-recovery','sm',`data-key="${esc(k)}"`)).join('')}</div>`:''}
 <h4>Change history</h4>${s.history.length?`<ul class="qs small">${s.history.slice(-8).reverse().map(h=>`<li><span class="mono">${esc(h.date.slice(0,16).replace('T',' '))}</span> ${esc(h.event)}</li>`).join('')}</ul>`:'<p class="small muted">No events yet.</p>'}</section></div>
 <section class="card"><h3>NIST AI RMF coverage</h3><p class="small muted">Every GOVERN subcategory maps to at least one practice. Program-level outcomes from the other functions are also covered: ${other.map(o=>`<span class="tag">${o}</span>`).join(' ')}</p><div class="tw"><table><thead><tr><th>GOVERN subcategory</th><th>AIRMAC practices</th></tr></thead><tbody>${cov.map(([g,ps])=>`<tr><td class="mono">${g}</td><td>${ps.map(id=>esc(id+' '+PRACTICES.find(p=>p.id===id).t)).join('<br>')}</td></tr>`).join('')}</tbody></table></div></section>`}

/* ================= Files ================= */
async function saveFile(name,data,mime){
 if(window.claude&&typeof window.claude.use==='function'){
  let d=null;try{d=await window.claude.use('downloads')}catch(_){}
  if(d){try{await d.save({filename:name,data});toast('Saved '+name+'.')}catch(e){toast(e&&e.code==='declined'?'Download cancelled.':'The file could not be saved here ('+(e&&e.code||'error')+').')}return}
  toast('Downloads are not available in this view. Open the standalone AIRMAC file to download.');return}
 const u=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Downloaded '+name+'.')}
const slug=()=>(s.meta.org||'assessment').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'').slice(0,40)||'assessment';
const csvCell=v=>'"'+String(Array.isArray(v)?v.join('; '):v??'').replace(/^[=+\-@\t\r]/,"'$&").replace(/"/g,'""')+'"';
const csv=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function exportJson(){saveFile('AIRMAC_'+slug()+'_'+today()+'.json',JSON.stringify(s,null,2),'application/json')}

/* ================= Confirm panel (no native dialogs) ================= */
let pending=null;
function confirmPanel({title,message,label,backup=false,run}){pending=run;document.getElementById('confirm-panel')?.remove();const el=document.createElement('section');el.id='confirm-panel';el.className='card';el.style.borderColor='var(--warn)';el.setAttribute('role','alertdialog');el.setAttribute('aria-label',title);
 el.innerHTML=`<h3>${esc(title)}</h3><p>${esc(message)}</p><div class="row"><button type="button" class="b pri" data-confirm="yes">${esc(label)}</button>${backup?'<button type="button" class="b" data-confirm="backup">Export JSON first</button>':''}<button type="button" class="b" data-confirm="cancel">Cancel</button></div>`;
 const m=document.getElementById('main');m.insertBefore(el,m.children[1]||null);el.querySelector('button').focus();el.scrollIntoView({block:'nearest'})}

/* ================= Actions ================= */
function draftFinding(p){const a=pr(p.id),o=operating(p.id);const f=blankFinding();f.id=nextId('F',s.findings);f.practice=p.id;f.title=p.t+': '+(a.design==='Not in place'?'not in place':a.design==='Partial'?'partially established':o.status==='Not operating'?'not operating in practice':'applied inconsistently');
 f.condition='Design: '+a.design+'.'+(a.design==='Established'||a.design==='Partial'?' Operation: '+o.status+(o.derived?' ('+o.detail+').':'.'):'')+(a.rationale?' '+a.rationale:'');f.criteria=p.s;f.severity=a.design==='Not in place'||o.status==='Not operating'?'High':'Medium';f.horizon=f.severity==='High'?'90 days':'6 months';return f}
function act(a,e){
 const i=+e.dataset.i;
 if(a==='go'){tab=+e.dataset.to;render();window.scrollTo(0,0);return}
 if(a==='export'){exportJson();return}
 if(a==='print'){window.print();return}
 if(a==='new'||a==='load-example'){const ex=a==='load-example';confirmPanel({title:ex?'Load the fictional example':'Start a new assessment',message:'This replaces the assessment saved in this browser. Export JSON first if you want to keep it.',label:ex?'Load example':'Start new',backup:true,run:()=>{s=ex?example():blank();if(!ex)s.history.push({date:nowIso(),event:'Assessment started.'});tab=ex?0:1;curP=PRACTICES[0].id;save();render();toast(ex?'Fictional example loaded.':'New assessment started. Begin with scope.')}});return}
 if(a==='prev-p'||a==='next-p'){const k=PRACTICES.findIndex(p=>p.id===curP)+(a==='next-p'?1:-1);if(PRACTICES[k]){curP=PRACTICES[k].id;pFilter='All';gapsOnly=false;render()}return}
 if(a==='filter-p'){pFilter=e.dataset.d;gapsOnly=false;tab=4;curP=PRACTICES.find(p=>p.d===pFilter).id;render();window.scrollTo(0,0);return}

const METHOD_RULES=["M01  The assessment shall cover the defined organization or portfolio using the eight domains and 33 practices in AIRMAC v1.0.0. The scope shall identify inclusions, exclusions, assessment period, reporting date, inventory sources, and limitations. Framework mappings and federal references shall be verified separately before release; reference tags shall not change scoring.", "M02  The lead assessor shall substantiate ratings and findings. The sponsor shall agree targets, priorities, and resource decisions. A designated reviewer, other than the lead where practicable, shall check evidence sufficiency, exclusions, and scoring before finalization. Reviewer identity and any independence limitation shall be recorded.", "M03  Each practice shall receive separate design and operating conclusions. Design options: Not rated; Not in place; Partial; Established; Not applicable. Established requires all material elements of the practice statement to be documented, approved where required, assigned, and in scope. Partial means one or more material elements are missing. Not in place means no substantive implementation is demonstrated.", "M04  Operating options shall be Not tested, Not operating, Inconsistent, Effective, or Not applicable. Effective requires sufficient evidence that the practice was followed across the eligible observations and assessment period. A policy alone shall not establish operating effectiveness. Material contradictions shall be resolved or reflected in the conclusion.", "M05  An Established practice with untested operation shall display \u201cOperation not verified,\u201d never \u201cMeets.\u201d Unrated or untested work shall appear in assessment limitations and completion counts. Verified deficiencies shall appear in gap counts. A design deficiency may be concluded without operating testing, provided the testing limitation is disclosed.", "M06  Every practice shall have a rationale. N/A shall require a scope-specific justification and reviewer approval. A practice with no applicable system observations shall not automatically become N/A if organization-wide responsibilities still apply.", "M07  Evidence used for a rating shall have a stable identifier, title, type, record date or explained absence, source or owner, retrievable reference, and assessment relevance. Links shall identify the practice or test and whether the record supports design, operation, measurement, or improvement. Evidence attachments are optional; retrievability is required.", "M08  Evidence sufficiency shall be judged for each conclusion using relevance, currency, coverage, reliability, and contradictory information. High means direct, authoritative support with adequate coverage; Moderate means adequate support with disclosed limits; Low means indirect or insufficiently corroborated support. Blank records shall not qualify. The highest-confidence linked record alone shall not determine conclusion confidence.", "M09  The sampling plan shall identify the population and eligible observations for each test. The default shall include all high-impact systems plus a random selection of at least max(2, ceiling(10% of other systems)), capped at the available other systems. This is an AIRMAC planning default, not a statistical assurance claim. Deviations shall require documented rationale, coverage limits, and reviewer approval.", "M10  Selection shall consider lifecycle stage, source, organizational coverage, material changes, and incidents. Each test shall define its applicability and observable pass criteria before testing. Each result shall record Pass, Fail, or N/A, with assessor, date, evidence references, and an exception explanation for Fail or N/A. One general notes field shall not replace test-specific support.", "M11  A test conclusion shall remain provisional while eligible selected observations are pending. The application shall show passed, failed, pending, N/A, and selected counts. Once complete: all applicable observations pass \u2192 Effective; at least half pass with any failure \u2192 Inconsistent; fewer than half pass \u2192 Not operating. Zero applicable observations shall trigger an applicability review, not an Effective conclusion.", "M12  Where only one eligible system exists in the population, testing it may support Effective with a disclosed small-population limitation. Where several exist but only one is tested, sufficiency shall require an approved sampling exception. Evidence across transactions or time may supplement system counts and shall be identified explicitly.", "M13  A failure of a required high-impact deployment authorization, required risk acceptance authority, or required stop or override capability shall cap the affected practice at Not operating until resolved and retested. Further critical exceptions shall be defined before fieldwork. Accepted residual risk shall not convert a failed process test into a Pass.", "M14  For applicable practices with design conclusions complete: fewer than half Partial or Established \u2192 ceiling 1; otherwise any practice not Established \u2192 ceiling 2. If all are Established, any untested or Not operating conclusion, or evidence below Moderate for either design or operation, shall cap the domain at 2. Inconsistent operation shall cap it at 3. Effective operation throughout supports 3; verified measurement and review support 4; verified improvements driven by measurement support 5. Incomplete design work shall produce a pending ceiling.", "M15  The assessor shall select a current level at or below the ceiling, supported by domain descriptors and rationale. Targets shall be sponsor-agreed and at least current level. A wholly excluded domain shall have no numeric rating. Overall shall be the lower median of all eight current domain levels, capped at the minimum plus one. If any domain is pending or excluded, no comparable overall number shall be issued; report the domain profile and limitation.", "M16  Each verified gap shall link to at least one finding or an explicitly linked consolidated finding. Findings shall record condition, criteria, cause or \u201cnot determined,\u201d effect, recommendation, severity rationale, affected practices and systems, supporting evidence, accountable owner, actual due date, and status. Missing assessment work shall have an assigned follow-up action.", "M17  Severity shall reflect consequence, exposure, urgency, and existing safeguards, using a documented rubric: Critical requires immediate leadership action for imminent or ongoing severe harm; High requires urgent action for material exposure or a failed mandatory gate; Medium requires planned correction of a meaningful weakness; Low covers limited deficiencies. Severity shall not be assigned solely from design status or pass rate.", "M18  Roadmap actions shall identify interim safeguards, dependencies, needed funding or staffing, leadership decisions, closure criteria, and verification evidence. Findings shall close only after verification against those criteria. Risk acceptance shall record the authorized official, rationale, conditions, expiry, and review date; accepted risk remains visible. A Closed finding shall not satisfy an unresolved gap without an explained, reviewed disposition.", "M19  The report shall show scope, method version, assessment ID, reporting date, domain results, targets, evidence confidence, sampling coverage, exclusions, limitations, portfolio posture, findings, roadmap, and sign-off. Portfolio indicators shall use explicit lifecycle and status definitions, valid dates, and the reporting date as the recency anchor. They shall not change capability scores.", "M20  Finalization shall require completed applicable design and operating work, approved exclusions and sample deviations, valid evidence links, ratings within ceilings, dispositions for gaps, complete roadmap commitments, executive summary, reviewer approval, and dated lead sign-off. Genuine inability to observe operation shall be documented and approved as a limitation, with the rating capped accordingly. Sponsor acceptance or its pending status shall be explicit.", "M21  Import shall validate allowed values, identifiers, dates, nonnegative risk counts, links, and readiness. Imported Final status shall be retained only if current validation passes; otherwise preserve original sign-off as history and return the working assessment to Draft. Any substantive change after finalization shall create a new draft revision while preserving the prior final baseline and recording who changed what and when.", "A01  Established plus sufficient design evidence plus Not tested operation displays \u201cOperation not verified\u201d; it never displays \u201cMeets.\u201d", "A02  Two Pass results and one pending result remain provisional and show all three selected observations.", "A03  An all-N/A domain cannot receive a numeric rating or contribute to an overall score.", "A04  A blank High-confidence evidence record cannot support completion, confidence, or a higher ceiling.", "A05  An approved one-system population can support operation; every test-level N/A and sampling deviation requires justification.", "A06  A critical exception overrides the aggregate pass rate; Closed findings cannot conceal continuing gaps.", "A07  Invalid imported Final data becomes Draft; subsequent edits preserve the previous final assessment."];

function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return false;const d=new Date(v+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===v}
function textOK(v){return typeof v==='string'&&!!v.trim()}
function blankTestDetail(){return {eligibility:'Applicable',reason:'',assessor:'',date:'',evidence:[],notes:'',critical:false,criticalWhy:'',stopAssessment:''}}

domainConf=function(did){const ps=PRACTICES.filter(p=>p.d===did&&['Partial','Established'].includes(pr(p.id).design));return ps.length?Math.min(...ps.map(p=>practiceConf(p.id))):0};
assessed=function(pid){const a=pr(pid);if(a.design==='Not rated'||!textOK(a.rationale))return false;if(a.design==='Not applicable')return a.naApproved;if(['Partial','Established'].includes(a.design)&&!support(pid,'design'))return false;return true};
testStats=function(tid){let pass=0,fail=0,na=0,open=0;for(const x of sampled()){const r=x.tests[tid],d=detail(x,tid);if(d.eligibility==='Not applicable'){if(r==='N/A'&&textOK(d.reason))na++;else open++}else if(r==='Pass')pass++;else if(r==='Fail')fail++;else open++}return {pass,fail,na,open,n:pass+fail,selected:sampled().length}};
function criticalFailure(t,x){const d=detail(x,t.id);return x.tests[t.id]==='Fail'&&d.eligibility==='Applicable'&&((x.tier==='High-impact'&&(['T4','T5'].includes(t.id)||(['T6','T14'].includes(t.id)&&d.stopAssessment==='Required stop or override unavailable')))||d.critical)}
operating=function(pid){const a=pr(pid),t=testFor(pid);if(a.design==='Not applicable')return {status:'Not applicable',derived:false,detail:'Practice excluded with rationale and reviewer approval.'};if(!t)return {status:a.critical?'Not operating':a.operating,derived:false,detail:a.critical?a.criticalWhy:''};const st=testStats(t.id);const unverified=sampled().filter(x=>!testReady(x,t)).length;let status='Not tested';const crit=a.critical||sampled().some(x=>criticalFailure(t,x));
 if(crit)status='Not operating';else if(!st.open&&st.n){const eligible=s.systems.filter(x=>detail(x,t.id).eligibility==='Applicable').length;const enough=st.n>=2||eligible===1||(s.meta.sampleApproved&&textOK(s.meta.sampleDeviation)&&textOK(s.meta.sampleLimitations));if(st.fail)status=st.pass/st.n>=.5?'Inconsistent':'Not operating';else if(enough&&!unverified)status='Effective'}
 const summary=`${st.pass} passed; ${st.fail} failed; ${st.open} pending; ${st.na} N/A; ${st.selected} selected; ${unverified} observation records incomplete.`;
 return {status,derived:true,detail:(crit?'Critical exception overrides pass rate. ':'')+summary+(st.n===1?' Single-observation coverage; document population or approved deviation.':''),test:t,st}
};
isGap=function(pid){const a=pr(pid);if(['Not applicable','Not rated'].includes(a.design))return false;return a.design!=='Established'||['Not operating','Inconsistent'].includes(operating(pid).status)};
pStatus=function(pid){const a=pr(pid);if(!assessed(pid))return ['To rate',''];if(a.design==='Not applicable')return ['N/A','na'];if(isGap(pid))return ['Gap','warn'];if(['Not tested','Not applicable'].includes(operating(pid).status)||!support(pid,'operation'))return ['Operation not verified','warn'];return ['Meets','good']};
attested=function(d,k){return d[k]&&textOK(d[k+'Why'])&&validLinks(d[k+'Ev'])};
ceiling=function(did){const ps=PRACTICES.filter(p=>p.d===did&&pr(p.id).design!=='Not applicable');if(!ps.length)return {level:null,why:'Not applicable — no numeric rating.'};if(PRACTICES.some(p=>p.d===did&&!assessed(p.id)))return {level:null,why:'Design assessment or exclusion approval pending.'};const des=ps.map(p=>pr(p.id).design);if(des.filter(d=>['Partial','Established'].includes(d)).length<ps.length/2)return {level:1,why:'Fewer than half of applicable practices are in place.'};if(des.some(d=>d!=='Established'))return {level:2,why:'Not all applicable practices are established.'};const ops=ps.map(p=>operating(p.id).status);if(ops.some(o=>['Not tested','Not operating','Not applicable'].includes(o))||ps.some(p=>practiceConf(p.id)<2))return {level:2,why:'Operation unverified, not operating, or evidence below Moderate.'};if(ops.includes('Inconsistent')||!attested(dom(did),'metrics'))return {level:3,why:'Established and operating; consistent effectiveness and measurement needed for level 4.'};if(!attested(dom(did),'improve'))return {level:4,why:'Measured and effective; verified improvement needed for level 5.'};return {level:5,why:'Effective, measured, and improving with valid evidence.'}};
overall=function(key){if(DOMAINS.some(d=>excluded(d.id)||ceiling(d.id).level===null))return null;const lv=DOMAINS.map(d=>Number(dom(d.id)[key]));if(lv.some(n=>!Number.isInteger(n)||n<1||n>5))return null;if(key==='current'&&DOMAINS.some(d=>+dom(d.id).current>ceiling(d.id).level))return null;lv.sort((a,b)=>a-b);return Math.min(lv[3],lv[0]+1)};
posture=function(){const sys=s.systems,hi=sys.filter(x=>x.tier==='High-impact');const end=s.meta.date;const date=new Date(end+'T12:00:00Z');date.setUTCFullYear(date.getUTCFullYear()-1);const start=isNaN(date)?'':date.toISOString().slice(0,10);return {total:sys.length,hi:hi.length,mod:sys.filter(x=>x.tier==='Moderate').length,low:sys.filter(x=>x.tier==='Low').length,third:sys.filter(x=>x.source!=='Built in-house').length,hiRecent:hi.filter(x=>validDate(x.lastAssessed)&&x.lastAssessed>=start&&x.lastAssessed<=end).length,never:sys.filter(x=>x.assessmentHistory==='Never assessed').length,unknown:sys.filter(x=>x.assessmentHistory==='Unknown').length,notAcc:sys.filter(x=>x.result==='Not acceptable').length,cond:sys.filter(x=>x.stage==='Operation'&&x.result==='Acceptable with conditions').length,openHigh:sys.reduce((n,x)=>n+(/^\d+$/.test(x.openHigh)?+x.openHigh:0),0),sampled:sampled().length,hiSampled:hi.filter(x=>x.sampled).length}};

const originalAct=act;act=function(a,e){if(a==='finalize'){const issues=readiness();if(issues.length){toast('Resolve all readiness items before finalizing.');return}s.signoff.state='Final';audit('Finalized revision '+s.revision+' with reviewer '+s.signoff.reviewer+'.');const snapshot=structuredClone({...s,baselines:[]});const html=reportHtml();if(!s.baselines.some(b=>b.revision===s.revision))s.baselines.push({revision:s.revision,date:nowIso(),assessment:snapshot,report:html});save();render();toast('Final revision '+s.revision+' preserved as a baseline.');return}if(a==='dl-inventory'){const keys=['id','name','purpose','owner','source','tier','stage','assessmentHistory','lastAssessed','result','openHigh','sampled','sampleWhy'];saveFile('AIRMAC_Inventory_'+slug()+'.csv',csv([keys,...s.systems.map(x=>keys.map(k=>x[k]))]),'text/csv');return}if(a==='baseline-json'||a==='baseline-report'){const b=s.baselines[+e.dataset.i];if(b)saveFile('AIRMAC_'+slug()+'_Final_r'+b.revision+(a==='baseline-json'?'.json':'.html'),a==='baseline-json'?JSON.stringify(b.assessment,null,2):b.report,a==='baseline-json'?'application/json':'text/html');return}
 if(a==='del-ev'){const rec=s.evidence[+e.dataset.i];if(!rec)return;confirmPanel({title:'Delete evidence '+rec.id,message:'This removes the record and unlinks it from current ratings, tests, and findings. Prior final baselines are preserved.',label:'Delete',run:()=>{touch();const id=rec.id;s.evidence=s.evidence.filter(x=>x.id!==id);for(const p of Object.values(s.practices))for(const k of ['evidence','designEv','operatingEv'])p[k]=p[k].filter(x=>x!==id);for(const d of Object.values(s.domains))for(const k of ['metricsEv','improveEv'])d[k]=d[k].filter(x=>x!==id);for(const x of s.systems)for(const t of TESTS)detail(x,t.id).evidence=detail(x,t.id).evidence.filter(v=>v!==id);for(const f of s.findings)for(const k of ['evidence','closureEv'])f[k]=f[k].filter(x=>x!==id);audit('Evidence deleted and unlinked: '+id);save();render()}});return}
 if(a==='del-f'){const f=s.findings[+e.dataset.i];if(!f)return;confirmPanel({title:'Delete finding '+f.id,message:'Remove this finding? Linked gaps will be checked again. Prior final baselines are preserved.',label:'Delete',run:()=>{touch();s.findings=s.findings.filter(x=>x.id!==f.id);audit('Finding deleted',f.id,JSON.stringify(f),'');save();render()}});return}

 if(['add-sys','add-ev','new-ev-link','add-f','draft-all','draft-one','random-sample'].includes(a)){originalAct(a,e);audit('Action: '+a);save();return}originalAct(a,e)};

reportHtml=function(){
