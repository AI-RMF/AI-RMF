 return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIRMAC ${VERSION} Report — ${esc(m.org)}</title><style>body{font:11pt/1.45 'Segoe UI',Arial,sans-serif;max-width:1050px;margin:32px auto;padding:0 24px;color:#14213A}h1{font-size:24pt}h2{font-size:17pt;border-bottom:1px solid #ccd4de;margin-top:28px}h3{font-size:13pt;margin-top:20px}p{margin:6px 0}table{width:100%;border-collapse:collapse;font-size:9pt;margin:12px 0;overflow-wrap:anywhere}th,td{border:1px solid #d6dce5;padding:6px;text-align:left;vertical-align:top}th{background:#e8edf3}small{color:#4c5869}.draft{padding:12px;border:2px solid #9a4a06}.finding{border-top:1px solid #ccd4de;padding-top:12px;margin-top:18px}a{color:#1f3a5f}@media print{body{margin:0;padding:0;font-size:10pt}h2,h3{break-after:avoid}tr{break-inside:avoid}thead{display:table-header-group}@page{size:letter;margin:.6in}</style></head><body>
 <p><b>SECURITY OF AI™ · AI Risk Management Capability Assessment</b></p><h1>${esc(m.org||'Untitled organization')}</h1><p>AIRMAC ${VERSION} · Method ${METHOD_VERSION} · ${esc(s.assessmentId)} · Revision ${s.revision} · ${esc(so.state)}</p>${s.example?'<p class="draft">Fictional example. Data is invented for demonstration; the example intentionally contains incomplete work.</p>':''}${so.state!=='Final'||issues.length?`<p class="draft">DRAFT / PROVISIONAL — ${issues.length} readiness item(s). Ratings and limitations require review.</p>`:''}
 ${def('Scope',m.scope+' — '+m.scopeNote)}${def('Reporting date',m.date)}${def('Assessment period',m.period)}${def('Lead and team',m.lead+'; '+m.team)}${def('Sponsor',m.sponsor)}
 <h2>1 Scorecard and executive summary</h2><p><b>Overall capability:</b> ${current?lvlName(current):'No comparable overall score'}. <b>Target:</b> ${target?lvlName(target):'Not available'}.</p><p>Overall uses the lower median of all eight domain levels, capped at the minimum plus one. An excluded or pending domain prevents a comparable overall score; unsupported current ratings also withhold it.</p>${rows(['Domain','Current','Target','Ceiling','Confidence','Evidence conclusion'],domainRows)}${def('Sponsor agreement on targets',(m.targetsAgreed?'Agreed':'Pending')+'; '+m.targetBasis)}${def('Executive summary',s.summary)}${def('Assessment facts',autoFacts())}
 <h2>2 Scope limitations and portfolio posture</h2>${def('Method',m.method)}${def('Roles interviewed',m.interviews)}${def('Population and sampling coverage',m.coverage)}${def('Assessment limitations',m.limitations)}${def('Sampling deviation',m.sampleDeviation)}${def('Coverage limitations',m.sampleLimitations)}${def('Sampling deviation approved',m.sampleApproved?'Yes':'No / not required')}${def('Inventory reconciliation',m.inventoryReconciled+'; '+m.inventorySources)}
 ${rows(['Systems','High-impact','High-impact assessed in preceding 12 months','Reported never assessed','Unknown history','In Operation with conditions','Not acceptable across stages','Open high/critical risks'],[[P.total,P.hi,P.hiRecent+'/'+P.hi,P.never,P.unknown,P.cond,P.notAcc,P.openHigh]])}<p>Portfolio posture is reported separately from capability. Recency is anchored to ${esc(m.date)}; future assessment dates are invalid. Never assessed is an explicit history declaration; missing history is Unknown. Conditional operation counts only the Operation stage.</p>
 <h2>3 Findings and leadership roadmap</h2>${s.findings.length?s.findings.slice().sort((a,b)=>SEVERITIES.indexOf(a.severity)-SEVERITIES.indexOf(b.severity)).map(f=>`<section class="finding"><h3>${esc(f.id+' '+f.title)}</h3>${def('Severity and rationale',f.severity+' — '+f.severityWhy)}${def('Status owner and due date',f.status+'; '+f.owner+'; '+f.dueDate)}${def('Practices and systems',[f.practice,...f.practices,...f.systems].filter(Boolean).join(', '))}${['condition','criteria','cause','effect','recommendation','safeguards','dependencies','resources','decision','closureCriteria','disposition'].map(k=>def({safeguards:'Interim safeguards',resources:'Funding or staffing',decision:'Leadership decision',closureCriteria:'Closure criteria'}[k]||k[0].toUpperCase()+k.slice(1),f[k])).join('')}${def('Supporting evidence',f.evidence.join(', '))}${def('Closure verification',f.verifiedBy+'; '+f.verifiedDate+'; evidence '+f.closureEv.join(', '))}${def('Continuing-gap disposition approved',f.dispositionApproved?'Yes':'No / not required')}${f.status==='Risk accepted'?def('Authorized risk acceptance',f.acceptAuthority+'; '+f.acceptRationale+'; conditions '+f.acceptConditions+'; review '+f.acceptReview+'; expiry '+f.acceptExpiry):''}</section>`).join(''):'<p>No findings recorded.</p>'}
 ${rows(['Action','Owner','Due date','Leadership decision','Resources','Status'],s.findings.filter(f=>f.status!=='Closed').sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).map(f=>[f.id+' '+f.recommendation,f.owner,f.dueDate,f.decision,f.resources,f.status]))}
 <h2>4 Domain and practice conclusions</h2>${DOMAINS.map(d=>`<h3>${esc(d.name)}</h3>${def('Domain rationale',dom(d.id).rationale)}${def('Measurement evidence and review',dom(d.id).metricsWhy+'; '+dom(d.id).metricsEv.join(', '))}${def('Improvement evidence',dom(d.id).improveWhy+'; '+dom(d.id).improveEv.join(', '))}${PRACTICES.filter(p=>p.d===d.id).map(p=>{const a=pr(p.id),op=operating(p.id);return `<h4>${esc(p.id+' '+p.t)}</h4>${def('Related NIST outcomes',p.nist.join(', '))}${m.overlay==='Federal'&&p.fed?def('Selected federal reference',p.fed):''}${def('Design operating status and assurance',a.design+'; '+op.status+'; '+pStatus(p.id)[0])}${def('Rationale',a.rationale)}${def('Design evidence and sufficiency',a.designEv.join(', ')+'; confidence '+a.designConfidence+'; '+a.designWhy)}${def('Operating evidence and sufficiency',a.operatingEv.join(', ')+'; confidence '+a.opConfidence+'; '+a.opWhy)}${op.derived?def('Sample conclusion',op.detail):''}${a.design==='Not applicable'?def('Practice exclusion approved',a.naApproved?'Yes':'No'):''}${def('Operational N/A',a.opNaWhy+'; approved '+a.opNaApproved)}${def('Limitation and follow-up',a.limitation+'; approved '+a.limitationApproved+'; owner '+a.followupOwner+'; due '+a.followupDate)}${a.critical?def('Critical exception',a.criticalWhy):''}`}).join('')}`).join('')}
 <h2>5 Inventory and operating tests</h2>${rows(['ID','System and purpose','Owner','Source','Tier','Stage','Assessment history','Last assessment and result','Open high/critical','Sample and reason'],s.systems.map(x=>[x.id,x.name+' — '+x.purpose,x.owner,x.source,x.tier,x.stage,x.assessmentHistory,x.lastAssessed+'; '+x.result,x.openHigh,(x.sampled?'Yes':'No')+'; '+x.sampleWhy]))}
 ${def('Test plan approval',m.planApprovedBy+'; '+m.planApprovedDate+'; locked '+m.criteriaLocked)}${def('Additional critical exceptions',m.additionalCritical)}${rows(['Test','Pass criteria','Applicability'],TESTS.map(t=>[t.id+' '+t.t,s.testPlan[t.id].criteria,s.testPlan[t.id].applicability]))}
 ${sampled().map(x=>`<h3>${esc(x.id+' '+x.name)}</h3>${rows(['Test','Result and eligibility','Assessor and date','Evidence','Observation / N/A / critical basis'],TESTS.map(t=>{const d=detail(x,t.id);return [t.id,(x.tests[t.id]||'Pending')+'; '+d.eligibility,d.assessor+'; '+d.date,d.evidence.join(', '),d.notes+'; '+d.reason+'; '+d.stopAssessment+(criticalFailure(t,x)?'; CRITICAL: '+(d.criticalWhy||'Required high-impact authorization, acceptance or stop capability failure'):'')]}))}`).join('')}
 <h2>6 Evidence register</h2>${rows(['ID','Title and type','Date or explanation','Source','Reference','Relevance','Source confidence','Notes'],s.evidence.map(e=>[e.id,e.title+'; '+e.type,e.date||e.dateWhy,e.source,e.ref,e.relevance,e.confidence,e.notes]))}
 <h2>7 Review readiness and sign-off</h2>${rows(['Lead sign-off','Reviewer approval','Independence statement','Sponsor disposition'],[[so.lead+'; '+so.leadDate,so.reviewer+'; '+so.reviewDate+'; approved '+so.reviewApproved,so.independence,so.sponsorStatus+'; '+so.sponsor+'; '+so.sponsorDate]])}${def('Sponsor comments',so.sponsorNote)}${issues.length?'<ul>'+issues.map(x=>`<li>${esc(x.m)}</li>`).join('')+'</ul>':'<p>All readiness requirements satisfied at generation.</p>'}
 <h2>8 Method and references</h2><p>These capability levels and thresholds are AIRMAC rules. Mappings show related NIST AI RMF 1.0 outcomes and do not establish certification, a complete AI RMF Profile, or federal compliance. Federal tags are selected references only; applicability requires organization-specific review.</p><p><a href="https://airc.nist.gov/airmf-resources/airmf/5-sec-core/">NIST AI RMF 1.0 Core</a> · <a href="https://www.whitehouse.gov/wp-content/uploads/2025/02/M-25-21-Accelerating-Federal-Use-of-AI-through-Innovation-Governance-and-Public-Trust.pdf">OMB M-25-21</a> · <a href="https://www.whitehouse.gov/wp-content/uploads/2025/02/M-25-22-Driving-Efficient-Acquisition-of-Artificial-Intelligence-in-Government.pdf">OMB M-25-22</a>. Reference review October 28, 2026.</p>${METHOD_RULES.map(t=>`<p>${esc(t)}</p>`).join('')}
 <h2>9 Change history</h2><p>Local history and sign-off use self-declared identities; they are not authenticated signatures or tamper-evident records.</p>${rows(['Time','Actor','Event','Field','Before','After'],s.history.map(h=>[h.date,h.actor,h.event,h.path,h.before,h.after]))}<p><small>Generated ${esc(nowIso())} by AIRMAC v${VERSION}. AI-RMF® · Security of AI™</small></p></body></html>`;

/* Hosted training assets — repository AI-RMF/AI-RMF, main branch. */
const HOSTED_ASSETS={
 repository:'https://github.com/AI-RMF/AI-RMF',
 pages:'https://ai-rmf.github.io/AI-RMF/',
 raw:'https://raw.githubusercontent.com/AI-RMF/AI-RMF/main/',
 worked:{file:'AIRMAC_Demo_Worked_Assessment.json',label:'Coastal Engineering worked demo'},
 starter:{file:'AIRMAC_Demo_Starter.json',label:'Coastal Engineering starter practice'}
};
let hostedLoad={busy:false,message:'Choose a demonstration to load from GitHub. Internet access is required.',error:false};
function hostedCandidates(filename){
 const urls=[];
 // Use the tool's adjacent assets first when hosted on the verified Pages site.
 if(globalThis.location?.protocol==='https:'&&globalThis.location.hostname==='ai-rmf.github.io'&&globalThis.location.pathname.startsWith('/AI-RMF/'))urls.push(new URL(filename,globalThis.location.href).href);
 urls.push(new URL(filename,HOSTED_ASSETS.pages).href,new URL(filename,HOSTED_ASSETS.raw).href);
 return [...new Set(urls)];
}
function hostedLink(file,view=false){return view?HOSTED_ASSETS.repository+'/blob/main/'+encodeURIComponent(file):new URL(file,HOSTED_ASSETS.pages).href}
function hostedDemoPanel(){const disabled=hostedLoad.busy?'disabled':'';return `<section class="card" data-hosted-demo-panel aria-busy="${hostedLoad.busy}"><h3>Demonstrations and user guide</h3><p>Load the fictional Coastal Engineering assessment directly from the hosted files. The worked demo includes results and findings; the starter practice leaves assessment work for you to complete.</p><div class="row">${btn('Load worked demo','load-hosted-worked','pri',disabled)}${btn('Load starter practice','load-hosted-starter','',disabled)}</div><p class="small ${hostedLoad.error?'':'muted'}" role="${hostedLoad.error?'alert':'status'}" aria-live="polite">${esc(hostedLoad.message)}</p><p class="small">Your assessment stays in this browser until you confirm replacement. Export JSON first if you want to keep it. Loading a demo does not send your assessment to GitHub.</p><ul class="small"><li><a href="${hostedLink('AIRMAC_Demonstration_Use_Case.docx')}" target="_blank" rel="noopener">Download the detailed use-case guide (.docx)</a></li><li><a href="${hostedLink('AIRMAC_Demo_Evidence.md',true)}" target="_blank" rel="noopener">Read the synthetic evidence notes</a></li><li><a href="${hostedLink(HOSTED_ASSETS.worked.file)}" target="_blank" rel="noopener">Open worked assessment JSON for local import</a> · <a href="${hostedLink(HOSTED_ASSETS.starter.file)}" target="_blank" rel="noopener">Open starter JSON</a></li><li><a href="${hostedLink('AIRMAC_Assessment_Method_Specification_Draft-28Oct26.docx')}" target="_blank" rel="noopener">Download the assessment method specification (.docx)</a></li><li><a href="${hostedLink('README.md',true)}" target="_blank" rel="noopener">Read the repository instructions</a></li></ul><p class="small muted">If loading fails, save a linked JSON file, then use Method & files → Import JSON. The built-in Harborview example remains available offline.</p></section>`}
function updateHostedPanels(){if([0,9].includes(tab))render()}
async function fetchHostedAssessment(kind){
 const asset=HOSTED_ASSETS[kind];if(!asset||!['worked','starter'].includes(kind))throw Error('Unknown demonstration.');
 const failures=[];
 for(const url of hostedCandidates(asset.file)){
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),10000);
  try{
   const response=await fetch(url,{signal:controller.signal,credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});
   if(!response.ok)throw Error('HTTP '+response.status);
   const length=Number(response.headers.get('content-length')||0);if(length>15e6)throw Error('File exceeds the 15 MB import limit.');
   const data=await response.text();if(new TextEncoder().encode(data).length>15e6)throw Error('File exceeds the 15 MB import limit.');
   let parsed;try{parsed=JSON.parse(data)}catch(_){throw Error('The host did not return a valid JSON file.')}
   // Use the same strict schema, evidence-link and final-state validation as local import.
   return {assessment:normalize(parsed),source:url,label:asset.label};
  }catch(error){failures.push(new URL(url).hostname+': '+(error.name==='AbortError'?'request timed out':error.message))}
  finally{clearTimeout(timeout)}
 }
 throw Error(failures.join(' | '));
}
function queueAssessmentImport(next,sourceLabel){
 confirmPanel({title:'Load '+sourceLabel,message:'Replace the assessment saved in this browser with “'+(next.meta.org||sourceLabel)+'”? Export JSON first to keep your current work. Nothing is replaced if you cancel.',label:'Load assessment',backup:true,run:()=>{
  hostedLoad.awaiting=false;hostedLoad.message='Assessment loaded. Choose another demonstration when needed.';s=next;let note='Assessment loaded.';
  if(s.signoff.state==='Final'&&readiness().length){s.signoff.state='Draft';s.history.push({date:nowIso(),actor:actor(),event:'Imported Final assessment failed current readiness checks; returned to Draft.'});note='Loaded as Draft because readiness checks are incomplete.'}
  s.history.push({date:nowIso(),actor:actor(),event:'Assessment loaded from '+sourceLabel+'.'});
  tab=0;curP=PRACTICES[0].id;pFilter='All';gapsOnly=false;fFilter='All';save();render();toast(note);
 }});
}
async function loadHostedAssessment(kind){
 if(hostedLoad.busy)return;
 if(pending){toast('Complete or cancel the current confirmation first.');return}
 hostedLoad={busy:true,error:false,message:'Loading and validating the '+(kind==='worked'?'worked demo':'starter practice')+'…'};updateHostedPanels();
 try{const result=await fetchHostedAssessment(kind);hostedLoad={busy:false,error:false,awaiting:true,message:'File validated. Confirm below to load it, or cancel to keep your assessment.'};updateHostedPanels();queueAssessmentImport(result.assessment,result.label+' from '+new URL(result.source).hostname)}
 catch(error){hostedLoad={busy:false,error:true,message:'Unable to load the hosted demonstration. Check your internet connection or download the JSON and use Import JSON. '+error.message};updateHostedPanels();toast('Demo loading failed. Your current assessment is unchanged.')}
}
const assessmentOverviewWithMethod=overview;overview=function(){return hostedDemoPanel()+assessmentOverviewWithMethod()};
const assessmentMethodWithFiles=method;method=function(){return hostedDemoPanel()+assessmentMethodWithFiles()};
const assessmentActionsWithMethod=act;act=function(action,element){if(action==='load-hosted-worked'){void loadHostedAssessment('worked');return}if(action==='load-hosted-starter'){void loadHostedAssessment('starter');return}return assessmentActionsWithMethod(action,element)};
document.addEventListener('click',event=>{const control=event.target.closest('[data-confirm]');if(control?.dataset.confirm==='cancel'&&hostedLoad.awaiting){hostedLoad.awaiting=false;hostedLoad.message='Loading cancelled. Your current assessment is unchanged.';updateHostedPanels()}});
// Local and hosted imports share the same confirmation and final-state handling.
importFile=async function(file){if(file.size>15e6){toast('Import files must be under 15 MB.');return}let next;try{next=normalize(JSON.parse(await file.text()))}catch(error){toast('Import rejected: '+error.message);return}queueAssessmentImport(next,file.name)};

initialize();
render();if(loadNote)setTimeout(()=>toast(loadNote),0);
